name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the client bundle
        run: npm run build

      - name: Fail when client.js is stale
        run: git diff --exit-code -- client.js

      - name: Test
        run: npm test
